# CI：配色与补丁脚本的零依赖自检（push / PR 时跑，不需要安装 DSH）。
#
# 启用位置是 .github/workflows/verify.yml；同一份内容保留在 measure/ci-verify.yml
# 作为 fork 或新插件仓库的模板，两处必须逐字节一致（verify-palette.mjs 会检查）。
#
# 为什么早期模板只放在 measure/ 下：推送 workflow 文件要求令牌具备 workflow 权限
# （gh 默认的 repo 权限不含它）。改用 SSH 通道推送（ssh://git@ssh.github.com:443/）
# 走的是密钥而不是 OAuth 令牌，就没有这个限制，可以直接启用。
name: verify

on:
  push:
  pull_request:

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the plugin package and palette
        run: node measure/verify-palette.mjs
      - name: Self-test the window-base patch script
        run: node measure/patch-window-base.mjs --self-test
